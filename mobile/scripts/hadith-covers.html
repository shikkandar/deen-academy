<!doctype html>
<!--
  Hadith book covers for the Hadith tab (assets/images/books/<id>.webp), 600x840, Arabic in Diwan Thuluth (macOS).
  Render each with headless Chrome, then shrink to WebP:
    for id in muntakhab sahaba1 sahaba2 sahaba3 sahaba4 bukhari muslim abudawud tirmidhi nasai ibnmajah malik nawawi qudsi dehlawi muntakhab-ta sahaba1-ta sahaba2-ta sahaba3-ta sahaba4-ta bukhari-ta muslim-ta abudawud-ta tirmidhi-ta nasai-ta ibnmajah-ta malik-ta nawawi-ta qudsi-ta dehlawi-ta; do
      "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars --allow-file-access-from-files \
        --default-background-color=00000000 --window-size=600,840 --screenshot=/tmp/$id.png "file://$PWD/scripts/hadith-covers.html#$id"
      cwebp -q 80 -resize 480 672 /tmp/$id.png -o assets/images/books/$id.webp
    done
-->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Thuluth; src: url('file:///System/Library/Fonts/Supplemental/Diwan%20Thuluth.ttf'); }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { width: 600px; height: 840px; overflow: hidden; }
  .book {
    position: relative; width: 600px; height: 840px; overflow: hidden;
    border-radius: 10px 22px 22px 10px;
    background:
      radial-gradient(120% 80% at 70% 20%, rgba(255,255,255,.10), transparent 60%),
      radial-gradient(90% 70% at 30% 100%, rgba(0,0,0,.35), transparent 70%),
      var(--c);
  }
  /* Spine: the bound edge on the left. */
  .book::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 46px;
    background: linear-gradient(90deg, rgba(0,0,0,.45), rgba(0,0,0,.12) 55%, rgba(255,255,255,.10) 80%, rgba(0,0,0,.25));
  }
  .book::after {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(35deg, rgba(255,255,255,.018) 0 2px, transparent 2px 5px);
    pointer-events: none;
  }
  .pattern { position: absolute; left: 46px; right: 0; top: 0; bottom: 0; opacity: .16; }
  .frame { position: absolute; left: 76px; right: 30px; top: 30px; bottom: 30px; border: 3px solid var(--g); border-radius: 6px; }
  .frame2 { position: absolute; left: 88px; right: 42px; top: 42px; bottom: 42px; border: 1.5px solid var(--g); border-radius: 4px; opacity: .8; }
  .corner { position: absolute; width: 64px; height: 64px; }
  .medallion {
    position: absolute; left: 46px; right: 0; top: 110px; height: 470px;
    display: flex; align-items: center; justify-content: center;
  }
  .ar {
    position: absolute; left: 46px; right: 0; top: 195px; height: 300px;
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-family: Thuluth, 'Diwan Thuluth'; color: var(--g); direction: rtl;
    font-size: var(--fs, 116px); line-height: 1.25;
    text-shadow: 0 2px 0 rgba(0,0,0,.35), 0 0 18px rgba(0,0,0,.25);
  }
  .en {
    position: absolute; left: 96px; right: 50px; bottom: 120px; text-align: center;
    font-family: 'Baskerville', 'Times New Roman', serif; color: var(--g);
    font-size: 30px; letter-spacing: 3px; text-transform: uppercase; line-height: 1.25;
  }
  .rule { position: absolute; left: 50%; bottom: 96px; width: 120px; margin-left: -37px; height: 2px; background: var(--g); opacity: .7; }
  .by {
    position: absolute; left: 96px; right: 50px; bottom: 62px; text-align: center;
    font-family: 'Baskerville', serif; font-style: italic; color: var(--g); opacity: .85; font-size: 20px; letter-spacing: 1px;
  }

  /* Hayatus Sahaba: its own design — a mihrab arch, a title band, the volume as a large Arabic numeral. */
  .sahaba .pattern, .sahaba .frame, .sahaba .frame2, .sahaba .corner, .sahaba .medallion, .sahaba .ar,
  .sahaba .en, .sahaba .rule, .sahaba .by { display: none; }
  .sh { display: none; }
  .q { display: none; }
  .mq { display: none; }
  .quran .pattern, .quran .frame, .quran .frame2, .quran .corner, .quran .medallion, .quran .ar,
  .quran .en, .quran .rule, .quran .by { display: none; }
  .quran .mq { display: block; }
  .quran .sh-arch { display: none; } /* its own display: flex would show it */
  .mq-art { position: absolute; left: 46px; top: 0; width: 554px; height: 840px; }
  .mq-title { position: absolute; left: 46px; right: 0; top: 338px; text-align: center; font-family: Thuluth, 'Diwan Thuluth';
    color: var(--g); direction: rtl; font-size: 58px; line-height: 1.3; text-shadow: 0 2px 0 rgba(0,0,0,.35), 0 0 18px rgba(0,0,0,.25); }
  .mq-lang { position: absolute; left: 46px; right: 0; top: 690px; text-align: center; font-family: 'Baskerville', serif;
    color: var(--g); font-size: 20px; letter-spacing: 4px; }
  .ta .mq-lang { font-family: 'Tamil Sangam MN', 'InaiMathi', serif; letter-spacing: 1px; font-size: 20px; font-weight: 700; }
  .qstar .medallion, .qcart .medallion { display: none; }
  .qstar .q-star { display: block; position: absolute; left: 73px; top: 150px; width: 500px; height: 500px; }
  .qcart .q-cart { display: block; position: absolute; left: 150px; right: 104px; top: 150px; height: 400px; border: 3px solid var(--g); border-radius: 170px; box-shadow: inset 0 0 0 10px transparent, inset 0 0 0 12px var(--g); opacity: .9; }
  .qcart .corner { display: none; }
  .sahaba .sh { display: block; }
  .sh-lattice { position: absolute; left: 46px; right: 0; top: 0; bottom: 0; opacity: .10; }
  .sh-band { position: absolute; left: 46px; right: 0; top: 46px; text-align: center; font-family: 'Baskerville', serif;
    color: var(--g); font-size: 26px; letter-spacing: 7px; }
  .sh-band::before, .sh-band::after { content: ''; display: block; height: 2px; margin: 14px 120px; background: var(--g); opacity: .6; }
  .sh-arch { position: absolute; left: 46px; right: 0; top: 130px; height: 470px; display: flex; justify-content: center; }
  .sh-title { position: absolute; left: 46px; right: 0; top: 245px; text-align: center; font-family: Thuluth, 'Diwan Thuluth';
    color: var(--g); font-size: 100px; line-height: 1.2; direction: rtl; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
  .sh-num { position: absolute; left: 46px; right: 0; top: 618px; text-align: center; font-family: 'Geeza Pro', 'Damascus', serif;
    color: var(--g); font-size: 64px; line-height: 1; }
  .sh-vol { position: absolute; left: 46px; right: 0; top: 700px; text-align: center; font-family: 'Baskerville', serif;
    color: var(--g); font-size: 22px; letter-spacing: 5px; }
  .sh-pages { position: absolute; left: 46px; right: 0; top: 740px; text-align: center; font-family: 'Baskerville', serif;
    font-style: italic; color: var(--g); opacity: .8; font-size: 19px; }

  /* Tamil covers (#<id>-ta): the same design with Tamil title and author. */
  .ta .en { font-family: 'Tamil Sangam MN', 'InaiMathi', serif; text-transform: none; letter-spacing: 0; font-size: 28px; font-weight: 700; }
  .ta .by { font-family: 'Tamil Sangam MN', 'InaiMathi', serif; font-style: normal; font-size: 18px; letter-spacing: 0; }
  .ta .sh-band { font-family: 'Tamil Sangam MN', 'InaiMathi', serif; letter-spacing: 1px; font-size: 26px; font-weight: 700; }
  .ta .sh-vol { font-family: 'Tamil Sangam MN', 'InaiMathi', serif; letter-spacing: 1px; font-size: 22px; }
  .ta .sh-pages { font-family: 'Tamil Sangam MN', 'InaiMathi', serif; font-style: normal; }
</style>
</head>
<body>
<div class="book" id="book">
  <svg class="pattern" viewBox="0 0 554 840" preserveAspectRatio="xMidYMid slice">
    <defs>
      <pattern id="star" width="92" height="92" patternUnits="userSpaceOnUse">
        <g fill="none" stroke="#fff" stroke-width="1.6">

          <rect x="26" y="26" width="40" height="40" />

          <circle cx="46" cy="46" r="9" />

        </g>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#star)" />
  </svg>
  <div class="frame"></div>
  <div class="frame2"></div>
  <svg class="corner" style="left:70px;top:24px" viewBox="0 0 64 64"><g fill="none" stroke="var(--g)" stroke-width="2.5"><path d="M6 40C6 20 20 6 40 6"/><path d="M6 26C6 15 15 6 26 6"/><circle cx="18" cy="18" r="4" fill="var(--g)"/></g></svg>
  <svg class="corner" style="right:24px;top:24px;transform:scaleX(-1)" viewBox="0 0 64 64"><g fill="none" stroke="var(--g)" stroke-width="2.5"><path d="M6 40C6 20 20 6 40 6"/><path d="M6 26C6 15 15 6 26 6"/><circle cx="18" cy="18" r="4" fill="var(--g)"/></g></svg>
  <svg class="corner" style="left:70px;bottom:24px;transform:scaleY(-1)" viewBox="0 0 64 64"><g fill="none" stroke="var(--g)" stroke-width="2.5"><path d="M6 40C6 20 20 6 40 6"/><path d="M6 26C6 15 15 6 26 6"/><circle cx="18" cy="18" r="4" fill="var(--g)"/></g></svg>
  <svg class="corner" style="right:24px;bottom:24px;transform:scale(-1,-1)" viewBox="0 0 64 64"><g fill="none" stroke="var(--g)" stroke-width="2.5"><path d="M6 40C6 20 20 6 40 6"/><path d="M6 26C6 15 15 6 26 6"/><circle cx="18" cy="18" r="4" fill="var(--g)"/></g></svg>

      <g fill="none" stroke="var(--g)">

          <rect x="70" y="70" width="260" height="260" rx="8" transform="rotate(0 200 200)" />
          <rect x="70" y="70" width="260" height="260" rx="8" transform="rotate(45 200 200)" />

          <rect x="84" y="84" width="232" height="232" rx="6" transform="rotate(67.5 200 200)" />
        </g>
        <circle cx="200" cy="200" r="132" stroke-width="1.2" opacity=".6" />
      </g>
      <circle cx="200" cy="200" r="128" fill="rgba(0,0,0,.18)" />
    </svg>
  </div>
  <svg class="sh sh-lattice" viewBox="0 0 554 840" preserveAspectRatio="xMidYMid slice">

      <pattern id="lat" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <path d="M0 28H56M28 0V56" stroke="#fff" stroke-width="1.4" fill="none" />

  <div class="sh sh-arch">

      <g fill="none" stroke="var(--g)">
        <path d="M20 470V200C20 95 110 40 190 10C270 40 360 95 360 200V470" stroke-width="3" />
        <path d="M44 470V206C44 112 122 64 190 36C258 64 336 112 336 206V470" stroke-width="1.4" opacity=".7" />
        <circle cx="190" cy="10" r="6" fill="var(--g)" />

  <svg class="q q-star" viewBox="0 0 400 400"><g fill="none" stroke="var(--g)"><g stroke-width="3"><rect x="70" y="70" width="260" height="260"/><rect x="70" y="70" width="260" height="260" transform="rotate(45 200 200)"/></g><g stroke-width="1.2" opacity=".6"><rect x="96" y="96" width="208" height="208"/><rect x="96" y="96" width="208" height="208" transform="rotate(45 200 200)"/></g></g></svg>
  <div class="q q-cart"></div>
  <svg class="mq mq-art" viewBox="0 0 554 840">
    <defs>
      <pattern id="mqBand" width="24" height="24" patternUnits="userSpaceOnUse">
        <g fill="none" stroke="var(--g)" stroke-width="1.3">
          <path d="M12 2 C17 7 17 17 12 22 C7 17 7 7 12 2 Z"/><path d="M2 12 C7 7 17 7 22 12 C17 17 7 17 2 12 Z"/>
          <circle cx="12" cy="12" r="2"/>

      <pattern id="mqFill" width="16" height="16" patternUnits="userSpaceOnUse">

    <path fill="url(#mqBand)" fill-rule="evenodd" d="M24 24 H530 V816 H24 Z M78 78 V762 H476 V78 Z"/>
    <g fill="none" stroke="var(--g)">

      <rect x="32" y="32" width="490" height="776" stroke-width="1"/>
      <rect x="70" y="70" width="414" height="700" stroke-width="1"/>

      <g stroke-width="2">

      <circle r="92" fill="rgba(0,0,0,.28)" stroke="var(--g)" stroke-width="2.5"/>

</div>
<script>
  const BOOKS = {
    quranar:  { quran: true, vol: 'ARABIC', volTa: 'அரபி', pages: '114 surahs', pagesTa: '114 சூராக்கள்', c: '#14432F', g: '#E9C77B' },
    quranta:  { quran: true, vol: 'TAMIL TRANSLATION', volTa: 'தமிழ் மொழிபெயர்ப்பு', pages: '114 surahs', pagesTa: '114 சூராக்கள்', c: '#1F3D5A', g: '#E9C77B' },
    quranen:  { quran: true, vol: 'ENGLISH TRANSLATION', volTa: 'ஆங்கில மொழிபெயர்ப்பு', pages: '114 surahs', pagesTa: '114 சூராக்கள்', c: '#3B2A55', g: '#E9C77B' },
    quranur:  { quran: true, vol: 'URDU TRANSLATION', volTa: 'உருது மொழிபெயர்ப்பு', pages: '114 surahs', pagesTa: '114 சூராக்கள்', c: '#5A2E1E', g: '#E9C77B' },
    muntakhab: { ar: 'منتخب<br>الأحاديث', en: 'Muntakhab Ahadith', by: 'Maulana Muhammad Yusuf Kandhlawi', c: '#1E1E24', g: '#E9C77B', fs: '100px' },
    sahaba1: { sahaba: true, num: '١', vol: 'VOLUME ONE', pages: '452 pages', c: '#1D4E4A', g: '#E9C77B' },
    sahaba2: { sahaba: true, num: '٢', vol: 'VOLUME TWO', pages: '588 pages', c: '#5E2230', g: '#E9C77B' },
    sahaba3: { sahaba: true, num: '٣', vol: 'VOLUME THREE', pages: '539 pages', c: '#283A66', g: '#E9C77B' },
    sahaba4: { sahaba: true, num: '٤', vol: 'VOLUME FOUR', pages: '199 pages', c: '#5B4022', g: '#E9C77B' },
    sahaba:   { ar: 'حياة<br>الصحابة', en: 'Hayatus Sahaba', by: 'Maulana Muhammad Yusuf Kandhlawi', c: '#3D5A2A', g: '#EED98A', fs: '108px' },
    bukhari:  { ar: 'صحيح<br>البخاري', en: 'Sahih al-Bukhari', by: 'Imam al-Bukhari', c: '#1F4D3A', g: '#E2C27A' },
    muslim:   { ar: 'صحيح<br>مسلم', en: 'Sahih Muslim', by: 'Imam Muslim', c: '#6B1F2A', g: '#E9C984' },
    abudawud: { ar: 'سنن<br>أبي داود', en: 'Sunan Abu Dawud', by: 'Imam Abu Dawud', c: '#1E3557', g: '#DDBF7E' },
    tirmidhi: { ar: 'جامع<br>الترمذي', en: 'Jami at-Tirmidhi', by: 'Imam at-Tirmidhi', c: '#5A3A1E', g: '#EACB8A' },
    nasai:    { ar: 'سنن<br>النسائي', en: 'Sunan an-Nasai', by: 'Imam an-Nasai', c: '#0F4C5C', g: '#E3C580' },

  // Tamil title and author for the Tamil covers (#<id>-ta).
  const TA_QURAN = {"quranar": {"en": "திருக்குர்ஆன்", "by": "அரபி"}, "quranta": {"en": "திருக்குர்ஆன்", "by": "தமிழ் மொழிபெயர்ப்பு"}, "quranen": {"en": "திருக்குர்ஆன்", "by": "ஆங்கில மொழிபெயர்ப்பு"}, "quranur": {"en": "திருக்குர்ஆன்", "by": "உருது மொழிபெயர்ப்பு"}};
  const TA = {"muntakhab": {"en": "முன்தகப் அஹாதீஸ்", "by": "மௌலானா முஹம்மத் யூஸுஃப் காந்தலவி"}, "bukhari": {"en": "ஸஹீஹ் அல்புகாரி", "by": "இமாம் புகாரி"}, "muslim": {"en": "ஸஹீஹ் முஸ்லிம்", "by": "இமாம் முஸ்லிம்"}, "abudawud": {"en": "ஸுனன் அபூதாவூத்", "by": "இமாம் அபூதாவூத்"}, "tirmidhi": {"en": "ஜாமிஉத் திர்மிதீ", "by": "இமாம் திர்மிதீ"}, "nasai": {"en": "ஸுனன் அந்நஸாயீ", "by": "இமாம் நஸாயீ"}, "ibnmajah": {"en": "ஸுனன் இப்னுமாஜா", "by": "இமாம் இப்னுமாஜா"}, "malik": {"en": "முவத்தா மாலிக்", "by": "இமாம் மாலிக்"}, "nawawi": {"en": "நவவீயின் 40 ஹதீஸ்கள்", "by": "இமாம் நவவீ"}, "qudsi": {"en": "40 ஹதீஸ் குத்ஸீ", "by": "புனித ஹதீஸ்கள்"}, "dehlawi": {"en": "40 ஹதீஸ்கள்", "by": "ஷாஹ் வலியுல்லாஹ் திஹ்லவீ"}};
  const TA_VOL = { '1': 'பாகம் ஒன்று', '2': 'பாகம் இரண்டு', '3': 'பாகம் மூன்று', '4': 'பாகம் நான்கு' };
  const [id, lang] = location.hash.slice(1).split('-');
  const tamil = lang === 'ta';
  const b = { ...(BOOKS[id] || BOOKS.bukhari), ...(tamil && (TA[id] || TA_QURAN[id]) ? (TA[id] || TA_QURAN[id]) : {}) };
  if (tamil && b.sahaba) {
    const v = id.slice(-1);
    b.vol = TA_VOL[v];
    b.pages = b.pages.replace('pages', 'பக்கங்கள்');
  }
  const book = document.getElementById('book');
  if (tamil) book.classList.add('ta');
  book.style.setProperty('--c', b.c);
  book.style.setProperty('--g', b.g);
  if (b.fs) book.style.setProperty('--fs', b.fs);
  if (b.look) book.classList.add(b.look);
  if (b.quran) {
    book.classList.add('quran');
    document.getElementById('mqLang').textContent = tamil ? b.volTa : b.vol;
  }
  if (b.sahaba) {
    book.classList.add('sahaba');
    if (tamil) document.querySelector('.sh-band').textContent = 'ஹயாத்துஸ் ஸஹாபா';
    if (b.band) document.querySelector('.sh-band').textContent = tamil ? b.bandTa : b.band;
    document.getElementById('shTitle').innerHTML = b.title || 'حياة<br>الصحابة';
    if (tamil && b.volTa) { b.vol = b.volTa; b.pages = b.pagesTa; }
    document.getElementById('shNum').textContent = b.num;
    document.getElementById('shVol').textContent = b.vol;
    document.getElementById('shPages').textContent = b.pages;
  }
  document.getElementById('ar').innerHTML = b.ar || '';
  document.getElementById('en').textContent = b.en || '';
  document.getElementById('by').textContent = b.by || '';
</script>
</body>
</html>
