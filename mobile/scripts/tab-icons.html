    for id in home quran qibla hadith settings namaz; do
      "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
        --default-background-color=00000000 --window-size=72,72 --screenshot=/tmp/$id.png "file://$PWD/scripts/tab-icons.html#$id"
    done
-->
